<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stay in touch · Ramiro Clemente</title>
<meta name="description" content="Join Ramiro Clemente's mailing list and manage optional workshop permissions.">
<meta name="robots" content="index,follow">
<style>
:root{--ink:#111;--muted:#666;--line:#e8e8e8;--bg:#fff;--soft:#f7f7f7;--max:680px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Futura PT","Avenir Next","Century Gothic",Arial,sans-serif;line-height:1.55;font-size:17px}
.wrap{width:min(92%,var(--max));margin:0 auto;padding:64px 0 80px}
h1{font-size:clamp(2.2rem,7vw,4rem);line-height:1.02;letter-spacing:-.04em;margin:0 0 18px}
.lead{font-size:1.1rem;color:#333;margin:0 0 32px}
.card{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:24px}
label{display:block;font-weight:600;margin-bottom:8px}
input[type="email"]{width:100%;font:inherit;padding:14px 16px;border:1px solid #cfcfcf;border-radius:12px;background:#fff;color:#111}
.consent{display:flex;gap:10px;align-items:flex-start;margin:18px 0 12px;font-size:.92rem;font-weight:400}
.consent input{margin-top:4px;flex:0 0 auto}
.optional{margin:22px 0 16px;padding-top:18px;border-top:1px solid var(--line);color:#555}
.optional-title{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#888;margin:0 0 8px}
.optional .consent{font-size:.82rem;line-height:1.45;margin:0}
button{width:100%;border:0;border-radius:999px;background:#111;color:#fff;font:inherit;font-weight:700;padding:14px 18px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.small{font-size:.78rem;color:var(--muted);margin:12px 0 0}
.small a{color:inherit;text-decoration:underline}
.status{margin:14px 0 0;font-size:.92rem;min-height:1.4em}
.success{display:none;text-align:center;padding:14px 0}
.success h2{font-size:1.6rem;margin:0 0 8px}
.honey{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;overflow:hidden!important}
</style>
</head>
<body>
<main class="wrap">
  <h1>Keep the creative process alive.</h1>
  <p class="lead">Stay in touch and receive news from my studio.</p>

  <section class="card" id="signupCard">
    <form id="newsletterForm" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <div class="honey" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <label class="consent">
        <input id="consent" name="newsletter_consent" type="checkbox" required>
        <span>Yes, I'd like to receive news, updates and offers from Ramiro Clemente by email. I can unsubscribe at any time.</span>
      </label>

      <button type="submit">YES, KEEP ME UPDATED</button>
      <p class="small"><a href="privacy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a></p>
      <p class="status" id="status" aria-live="polite"></p>
    </form>

    <div class="success" id="success">
      <h2>You're on the list.</h2>
      <p>Thank you. I'll keep you updated from Barcelona.</p>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';

  const ENDPOINT = 'https://vhtasjikqfldoilqdbhv.supabase.co/functions/v1/submit-form';
  const CONSENT_TEXT = "Yes, I'd like to receive news, updates and offers from Ramiro Clemente by email. I can unsubscribe at any time.";
  const CONSENT_VERSION = 'workshop_email_optin_en_v2_2026-09-19';
  const form = document.getElementById('newsletterForm');
  const status = document.getElementById('status');
  const success = document.getElementById('success');
  const button = form.querySelector('button[type="submit"]');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const consent = document.getElementById('consent').checked;
    const website = document.getElementById('website').value.trim();

    status.textContent = '';

    if (!email || !form.querySelector('#email').checkValidity()) {
      status.textContent = 'Please enter a valid email address.';
      return;
    }

    if (!consent) {
      status.textContent = 'Please tick the box to join the mailing list.';
      return;
    }

    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = 'Joining…';

    try {
      const response = await fetch(ENDPOINT, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        mode: 'cors',
        credentials: 'omit',
        cache: 'no-store',
        body: JSON.stringify({
          form_type: 'newsletter',
          source_page: window.location.href.split('#')[0],
          language: 'en',
          email: email.toLowerCase(),
          marketing_consent: true,
          consent_version: CONSENT_VERSION,
          consent_text: CONSENT_TEXT,
          website
        })
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.error || 'submit_failed');

      form.style.display = 'none';
      success.style.display = 'block';
    } catch (error) {
      console.error(error);
      status.textContent = 'Something went wrong. Please try again in a few minutes.';
    } finally {
      button.disabled = false;
      button.textContent = originalText;
    }
  });
})();
</script>
</body>
</html>
