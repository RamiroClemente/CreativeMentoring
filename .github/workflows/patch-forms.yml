name: Patch CreativeMentoring forms

on:
  push:
    paths:
      - '.github/workflows/patch-forms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch production HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('es-v3.html')]
          script = '<script src="forms.js" defer></script>'

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text

              # Stop direct submissions to FormSubmit/mailto. forms.js handles all form traffic.
              text = text.replace('action="https://formsubmit.co/ramiroclemente2000@gmail.com"', 'action="#"')
              text = text.replace('action="mailto:ramiroclemente2000@gmail.com"', 'action="#"')

              if script not in text:
                  text = text.replace('</body>', f'{script}\n</body>')

              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched pages
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html es-v3.html
          git commit -m "Connect CreativeMentoring forms to secure Supabase endpoint"
          git push
