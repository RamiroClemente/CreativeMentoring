name: Test CreativeMentoring form notifications

on:
  push:
    paths:
      - '.github/workflows/test-form-notifications.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test newsletter, contact and discount forms
        run: |
          set -euo pipefail
          endpoint='https://vhtasjikqfldoilqdbhv.supabase.co/functions/v1/submit-form'
          origin='https://ramiroclemente.github.io'

          post() {
            payload="$1"
            response=$(curl -sS -w '\n%{http_code}' -X POST "$endpoint" \
              -H "Origin: $origin" \
              -H 'Content-Type: application/json' \
              --data "$payload")
            body=$(printf '%s' "$response" | sed '$d')
            code=$(printf '%s' "$response" | tail -n1)
            echo "HTTP $code"
            echo "$body"
            test "$code" = "200"
            echo "$body" | grep -q '"ok":true'
            echo "$body" | grep -q '"notification":true'
          }

          post '{"form_type":"newsletter","source_page":"https://ramiroclemente.github.io/CreativeMentoring/test-newsletter","language":"en","email":"cm-newsletter-test@example.com","marketing_consent":true,"consent_version":"cm_newsletter_en_v1","consent_text":"I’d like to receive Ramiro’s newsletter, updates and occasional offers. I can unsubscribe anytime."}'
          post '{"form_type":"contact","source_page":"https://ramiroclemente.github.io/CreativeMentoring/test-contact","language":"en","name":"Test Contact","email":"cm-contact-test@example.com","message":"Automated end-to-end contact form test.","marketing_consent":false}'
          post '{"form_type":"discount_lead","source_page":"https://ramiroclemente.github.io/CreativeMentoring/test-discount","language":"en","email":"cm-discount-test@example.com","previous_customer":false,"marketing_consent":false}'
